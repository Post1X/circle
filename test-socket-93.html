<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Socket.IO Test 93.183.106.254</title>
  <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 10px;
    }
    input, button, textarea {
      font-family: inherit;
      font-size: 14px;
    }
    .row {
      margin-bottom: 10px;
    }
    label {
      display: inline-block;
      width: 120px;
    }
    input[type="text"] {
      width: 260px;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #222;
      color: #eee;
    }
    button {
      padding: 6px 12px;
      margin-right: 6px;
      border-radius: 4px;
      border: none;
      background: #1976d2;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #1565c0;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #status {
      padding: 6px 10px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .status-disconnected { background: #b71c1c; }
    .status-connecting { background: #f57f17; }
    .status-connected { background: #1b5e20; }
    #log {
      width: 100%;
      height: 320px;
      margin-top: 10px;
      background: #000;
      color: #0f0;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #333;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .small {
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Socket.IO тест к 93.183.106.254</h1>
    <div id="status" class="status-disconnected">Отключено</div>

    <div class="row">
      <label for="serverUrl">Server URL:</label>
      <input id="serverUrl" type="text" value="http://93.183.106.254:8000" />
      <button id="btnConnect" onclick="connectSocket()">Подключиться</button>
      <button onclick="disconnectSocket()">Отключиться</button>
    </div>

    <div class="row">
      <label for="userId">user_id:</label>
      <input id="userId" type="text" placeholder="UUID пользователя" />
      <button onclick="emitAuthenticate()">authenticate</button>
    </div>

    <div class="row">
      <label>Матчмейкинг:</label>
      <button onclick="emitJoinGame()">join_game</button>
      <span class="small">(использует текущий user_id)</span>
    </div>

    <div class="row">
      <label>Служебное:</label>
      <button onclick="emitGetRooms()">get_rooms</button>
      <button onclick="clearLog()">Очистить лог</button>
    </div>

    <div class="row small">
      Подписаны события: <b>authenticated</b>, <b>auth_error</b>, <b>joined_room</b>,
      <b>player_joined</b>, <b>game_started</b>, <b>game_state</b>, <b>phase_changed</b>, <b>error</b>, а также все события через <code>onAny</code>.
    </div>

    <div id="log"></div>
  </div>

  <script>
    let socket = null;

    function setStatus(text, cls) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = cls;
    }

    function log(message, data) {
      const logEl = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      let line = '[' + time + '] ' + message;
      if (data !== undefined) {
        try {
          line += ' ' + JSON.stringify(data);
        } catch {
          line += ' ' + String(data);
        }
      }
      logEl.textContent += line + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    function connectSocket() {
      const url = document.getElementById('serverUrl').value.trim();
      if (!url) {
        alert('Укажи URL сервера');
        return;
      }
      if (socket && socket.connected) {
        log('Уже подключены к ' + url);
        return;
      }

      setStatus('Подключение...', 'status-connecting');
      log('Подключаемся к ' + url + ' ...');

      socket = io(url, {
        transports: ['websocket', 'polling'],
      });

      socket.on('connect', () => {
        setStatus('Подключено: ' + socket.id, 'status-connected');
        log('connect', { id: socket.id });
      });

      socket.on('disconnect', (reason) => {
        setStatus('Отключено (' + reason + ')', 'status-disconnected');
        log('disconnect', { reason });
      });

      socket.on('connect_error', (err) => {
        setStatus('Ошибка подключения', 'status-disconnected');
        log('connect_error', { message: err.message });
      });

      // Важные игровые события
      socket.on('authenticated', (data) => log('authenticated', data));
      socket.on('auth_error', (data) => log('auth_error', data));
      socket.on('joined_room', (data) => log('joined_room', data));
      socket.on('player_joined', (data) => log('player_joined', data));
      socket.on('game_started', (data) => log('game_started', data));
      socket.on('game_state', (data) => log('game_state', data));
      socket.on('phase_changed', (data) => log('phase_changed', data));
      socket.on('error', (data) => log('error', data));

      // Лог всего подряд
      socket.onAny((event, ...args) => {
        log('onAny: ' + event, args.length ? args[0] : undefined);
      });
    }

    function disconnectSocket() {
      if (socket) {
        socket.disconnect();
        socket = null;
        setStatus('Отключено', 'status-disconnected');
        log('Отключились вручную');
      }
    }

    function emitAuthenticate() {
      if (!socket || !socket.connected) {
        alert('Нет подключения');
        return;
      }
      const userId = document.getElementById('userId').value.trim();
      if (!userId) {
        alert('Укажи user_id (UUID)');
        return;
      }
      const payload = { user_id: userId };
      log('emit authenticate', payload);
      socket.emit('authenticate', payload);
    }

    function emitJoinGame() {
      if (!socket || !socket.connected) {
        alert('Нет подключения');
        return;
      }
      const userId = document.getElementById('userId').value.trim();
      if (!userId) {
        alert('Сначала зааутентись (user_id)');
        return;
      }
      const payload = {
        entry_fee: 0,
        min_players: 1,
        max_players: 100,
      };
      log('emit join_game', payload);
      socket.emit('join_game', payload);
    }

    function emitGetRooms() {
      if (!socket || !socket.connected) {
        alert('Нет подключения');
        return;
      }
      log('emit get_rooms');
      socket.emit('get_rooms');
    }

    function clearLog() {
      document.getElementById('log').textContent = '';
    }

    window.addEventListener('beforeunload', () => {
      if (socket) socket.disconnect();
    });
  </script>
</body>
</html>
